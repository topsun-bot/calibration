[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires RealSense, USB camera, D1 arm, or GPU/YOLO weights (skipped on GitHub Actions)",
]

[tool.ruff]
target-version = "py311"
exclude = ["third_party"]

[tool.ruff.lint]
# Fail on real breakage, not existing style. Format is not enforced in CI.
select = ["E9", "F63", "F7", "F82"]
